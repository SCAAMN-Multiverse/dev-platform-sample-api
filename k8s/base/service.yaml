apiVersion: v1
kind: Service
metadata:
  name: sample-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sample-api
  ports:
    # El Service SIEMPRE expone el 80 aunque el contenedor escuche en 3000
    # (PLATFORM.md §3). El puerto 9229 (depurador) NO se publica aquí a
    # propósito: se alcanza por port-forward, no por red del cluster.
    - name: http
      port: 80
      targetPort: http
