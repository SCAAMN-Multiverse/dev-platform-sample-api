# Presupuesto de `pro`: proceso Node compilado, sin compilador en memoria.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api
spec:
  template:
    spec:
      containers:
        - name: app
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 768Mi
